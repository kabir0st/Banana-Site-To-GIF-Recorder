<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="Logo">
        <h1>Banana Gif</h1>
      </div>
    </div>

    <!-- Phase 1: Start / Recording -->
    <div id="startView" class="view">
      <img class="illustration" src="../icons/icon128.png" alt="Banana">
      
      <div id="status-area">
        <p id="status" class="status-text">Ready to peel?</p>
        
        <div class="progress-container hidden" id="progressContainer">
          <!-- Progress will be shown in the button now -->
        </div>
      </div>

      <div class="settings-area">
        <div class="setting-item">
          <label class="setting-label">FPS</label>
          <div class="button-group" id="fpsGroup">
            <button class="group-btn active" data-value="24">24</button>
            <button class="group-btn" data-value="60">60</button>
          </div>
        </div>
        <div class="setting-item">
          <label class="setting-label">Quality</label>
          <div class="button-group" id="qualityGroup">
            <button class="group-btn" data-value="low">Low</button>
            <button class="group-btn active" data-value="normal">Medium</button>
            <button class="group-btn" data-value="high">High</button>
          </div>
        </div>
      </div>

      <button id="startBtn" class="btn btn-primary">
        Start Recording
      </button>
      
      <button id="cancelBtn" class="btn btn-secondary hidden">
        Stop
      </button>
    </div>

    <!-- Phase 2: Result -->
    <div id="resultView" class="view hidden">
      <div class="preview-container">
        <img id="previewGif" src="" alt="Recorded GIF">
      </div>
      
      <div id="fileInfo" class="file-info">GIF Ready!</div>

      <button id="downloadBtn" class="btn btn-primary">
        <span>⬇️</span> Download GIF
      </button>
      
      <button id="resetBtn" class="btn btn-text">
        Back to Start
      </button>
    </div>

    <div class="footer">
      <a href="https://www.buymeacoffee.com/kabir0st" target="_blank" class="bmc-button">
        <span class="bmc-emoji">🍕</span>
        <span class="bmc-text">Buy me a pizza</span>
      </a>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
