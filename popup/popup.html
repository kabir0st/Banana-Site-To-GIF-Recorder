<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <span>🍌</span>
        <h1>Banana Gif</h1>
      </div>
    </div>

    <!-- Phase 1: Start / Recording -->
    <div id="start-view" class="view">
      <div class="illustration">🍌</div>
      
      <div id="status-area">
        <p id="status" class="status-text">Ready to peel?</p>
        
        <div id="progress-container" class="progress-container hidden">
          <div class="progress-bar">
            <div id="progressBar" class="progress-fill"></div>
          </div>
          <span id="progressText" class="progress-text">0%</span>
        </div>
      </div>

      <button id="startBtn" class="btn btn-primary">
        <span>📹</span> Start Recording
      </button>
      
      <button id="cancelBtn" class="btn btn-secondary hidden">
        Stop
      </button>
    </div>

    <!-- Phase 2: Result -->
    <div id="result-view" class="view hidden">
      <div class="preview-container">
        <img id="previewGif" src="" alt="Recorded GIF">
      </div>
      
      <div id="fileInfo" class="file-info">GIF Ready!</div>

      <button id="downloadBtn" class="btn btn-primary">
        <span>⬇️</span> Download GIF
      </button>
      
      <button id="resetBtn" class="btn btn-text">
        Back to Start
      </button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
